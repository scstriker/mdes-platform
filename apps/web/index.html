<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>医疗器械产业数据平台 · ITEI</title>
    <!-- 刊头 display-hero：Noto Serif SC（OFL），不嵌入商业汉仪粗宋 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&display=swap"
    />
    <script>
      // 首屏渲染前写入主题，避免闪烁；逻辑与 src/lib/theme.ts 一致
      try {
        var t = localStorage.getItem("mdes-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
