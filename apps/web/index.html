<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ITEI 医疗器械产业数据系统</title>
    <script>
      // 首屏渲染前写入主题，避免闪烁；逻辑与 src/lib/theme.ts 一致
      try {
        var t = localStorage.getItem("mdes-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
